services:

  # Databases

  postgres:
    image: postgres:17
    container_name: db-tis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  mongo:
    image: mongo:8
    container_name: db-tis-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7
    container_name: db-tis-redis
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./init/redis/entrypoint.sh:/entrypoint.sh
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mq-tis-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - internal

  martin:
    build:
      context: ./martin
      dockerfile: Dockerfile
    container_name: tis-martin
    restart: unless-stopped
    command: ["--config", "/config/martin.yaml"]
    ports:
      - "${MARTIN_PORT}:3000"
    volumes:
      - ./geodata/denmark.pmtiles:/data/denmark.pmtiles:ro
      - ./geodata/water.pmtiles:/data/water.pmtiles:ro
      - ./geodata/bus-routes.pmtiles:/data/gtfs/bus-routes.pmtiles:ro
      - ./geodata/train-routes.pmtiles:/data/gtfs/train-routes.pmtiles:ro
      - ./geodata/metro-routes.pmtiles:/data/gtfs/metro-routes.pmtiles:ro
      - ./geodata/ferry-routes.pmtiles:/data/gtfs/ferry-routes.pmtiles:ro
      - ./geodata/light-rail-routes.pmtiles:/data/gtfs/light-rail-routes.pmtiles:ro
      - ./geodata/bus-stops.pmtiles:/data/gtfs/bus-stops.pmtiles:ro
      - ./martin/config.yaml:/config/martin.yaml:ro

