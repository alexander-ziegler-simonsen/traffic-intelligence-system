services:

  # Databases

  postgres:
    image: postgis/postgis:18-3.6
    container_name: db-tis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7
    container_name: db-tis-redis
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./init/redis/entrypoint.sh:/entrypoint.sh
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  martin:
    build:
      context: ./martin
      dockerfile: Dockerfile
    container_name: tis-martin
    restart: unless-stopped
    command: ["--config", "/config/martin.yaml"]
    ports:
      - "${MARTIN_PORT}:3000"
    volumes:
      - ./geodata/denmark.pmtiles:/data/denmark.pmtiles:ro
      - ./geodata/water.pmtiles:/data/water.pmtiles:ro
      - ./geodata/bus-routes.pmtiles:/data/gtfs/bus-routes.pmtiles:ro
      - ./geodata/train-routes.pmtiles:/data/gtfs/train-routes.pmtiles:ro
      - ./geodata/metro-routes.pmtiles:/data/gtfs/metro-routes.pmtiles:ro
      - ./geodata/ferry-routes.pmtiles:/data/gtfs/ferry-routes.pmtiles:ro
      - ./geodata/light-rail-routes.pmtiles:/data/gtfs/light-rail-routes.pmtiles:ro
      - ./geodata/bus-stops.pmtiles:/data/gtfs/bus-stops.pmtiles:ro
      - ./martin/config.yaml:/config/martin.yaml:ro

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    platform: linux/amd64
    container_name: tis-valhalla
    restart: unless-stopped
    environment:
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
      server_threads: "2"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - valhalla_data:/custom_files
      - ./geodata/denmark-latest.osm.pbf:/custom_files/denmark-latest.osm.pbf
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15m
    networks:
      - internal

# Volumes & Networks

volumes:
  postgres_data:
  redis_data:
  valhalla_data:

networks:
  internal:
    driver: bridge
